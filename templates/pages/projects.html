{% extends 'base.html' %}

{% block title %}Projects | {{ author_name }}{% endblock %}

{% block content %}
<h2 class="fw-bold mb-4"><span class="accent-text">02.</span> Projects</h2>

<div class="row g-4">
  {% for project in project_list %}
    <div class="col-md-6 col-lg-4">
      <div class="card-custom p-4 h-100 d-flex flex-column justify-content-between">
        <div>
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="badge bg-dark border border-secondary text-emerald">{{ project.status }}</span>
          </div>
          <h4 class="fw-bold text-white mb-2">{{ project.title }}</h4>
          <p class="text-secondary small mb-3">{{ project.description }}</p>
        </div>
        <div>
          <p class="small fw-semibold accent-text mb-2">Tech: {{ project.tech }}</p>
          <a href="{{ project.github }}" target="_blank" class="btn btn-sm btn-outline-light w-100">View Source</a>
        </div>
      </div>
    </div>
  {% endfor %}
</div>
{% endblock %}
