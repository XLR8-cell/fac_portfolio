<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    .navbar { background-color: #1e293b !important; border-bottom: 1px solid #334155; }
    .accent-text { color: #10b981; }
    .accent-bg { background-color: #10b981; color: #0f172a; }
    .card-custom { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; color: #f8fafc; }
    footer { margin-top: auto; background-color: #1e293b; border-top: 1px solid #334155; }
    .nav-link { color: #94a3b8 !important; font-weight: 500; }
    .nav-link:hover, .nav-link.active { color: #10b981 !important; }
  </style>
</head>
<body>

  <!-- Shared Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="{% url 'pages:home' %}">
        <span class="accent-text">&lt;/&gt;</span> {{ author_name }}
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav gap-2">
          <li class="nav-item"><a class="nav-link" href="{% url 'pages:home' %}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'pages:about' %}">About</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'pages:projects' %}">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'pages:skills' %}">Skills</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'pages:contact' %}">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Content Block -->
  <main class="container py-5">
    {% block content %}{% endblock %}
  </main>

  <!-- Shared Footer -->
  <footer class="py-4 text-center">
    <div class="container">
      <p class="mb-1 text-secondary">&copy; {{ current_year }} {{ author_name }}. Built with Python, Django & Bootstrap 5.</p>
      <div class="small">
        <a href="{{ github_url }}" target="_blank" class="text-decoration-none accent-text me-3">GitHub</a>
        <a href="{{ linkedin_url }}" target="_blank" class="text-decoration-none accent-text">LinkedIn</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
